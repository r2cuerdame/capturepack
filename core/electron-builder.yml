appId: io.github.r2cuerdame.capturepack
productName: CapturePack
directories:
  output: release
files:
  - dist/**
  - package.json
# The UI Automation helper (GOAL "Static object picking") is read by main
# through Node's asar-aware fs and handed to powershell.exe as an encoded
# command, so it does not have to exist as a real file — unpacking it anyway
# keeps it inspectable (READ-ONLY BY CONSTRUCTION is a claim a user can check)
# and keeps `powershell -File dist/scripts/uia-dump.ps1` working standalone.
#
# dist/scripts/native-host.js MUST be unpacked: it is executed by a fresh Node
# process (ELECTRON_RUN_AS_NODE), which knows nothing about Electron's archive
# format and could not open a path inside app.asar.
asarUnpack:
  - dist/scripts/**
# The browser extension (GOAL "Chrome Extension") ships WITH the app, unpacked
# and as real files: the user loads this folder in their browser, so it has to
# be a path they can open, paste, and see. Inside the asar it would be a path
# Chrome cannot read.
extraResources:
  - from: ../extensions/chrome
    to: extensions/chrome
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: CapturePack-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
publish:
  provider: github
  owner: r2cuerdame
  repo: capturepack
  # A package is never public until the release workflow has verified the
  # installer, latest.yml hashes, checksums, and uploaded bytes. The workflow
  # explicitly publishes the verified draft as its final step; updater clients
  # continue to see the previous release until then.
  releaseType: draft
  # Bound each GitHub API/upload request as well as the workflow step itself.
  # This prevents a broken network connection from looking like an installer
  # build that has frozen indefinitely.
  timeout: 120000
