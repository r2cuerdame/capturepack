appId: io.github.r2cuerdame.capturepack
productName: CapturePack
directories:
  output: release
files:
  - dist/**
  - package.json
# PowerShell cannot read a script from inside an asar archive, and the UI
# Automation helper (GOAL "Static object picking") is spawned as a real file.
asarUnpack:
  - dist/scripts/**
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: CapturePack-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: r2cuerdame
  repo: capturepack
  # Publish releases immediately: electron-updater cannot see draft releases
  # (the provider default), which would silently break auto-update.
  releaseType: release
