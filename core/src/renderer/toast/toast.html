<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'"
  />
  <title data-i18n="toast.windowTitle">CapturePack — Saved</title>
  <link rel="stylesheet" href="./toast.css" />
</head>
<body>
  <main id="toast">
    <header>
      <span class="saved" data-i18n="toast.saved">Saved</span>
      <span id="folderName" class="folder" title=""></span>
      <button id="closeBtn" type="button" aria-label="Close" data-i18n-aria-label="toast.close">×</button>
    </header>
    <div class="buttons">
      <button id="openFolderBtn" type="button" data-i18n="toast.openFolder">Open Folder</button>
      <button id="copyPathBtn" type="button" data-i18n="toast.copyPath">Copy Folder Path</button>
      <button id="createZipBtn" type="button" data-i18n="toast.createZip">Create ZIP</button>
      <button id="copyPromptBtn" type="button" data-i18n="toast.copyPrompt">Copy Prompt</button>
    </div>
    <!-- A display was not recording at the trigger (GOAL "Say that you are
         recording"): the pack is (partly) screenshot-only and says so here,
         with the same reason the tray gives. Text is set from i18n at runtime. -->
    <div id="replayWarning" class="warning" hidden></div>
    <div id="blurWarning" class="warning" hidden data-i18n="toast.blurWarning">
      Original replay contains unredacted content — share replay_annotated.webm or create a sanitized ZIP.
    </div>
    <div id="renderStatus" class="status" hidden>
      <span id="renderLabel"></span>
      <!-- The bar is INDETERMINATE until the render reports a real playhead:
           a filled fraction nobody measured is a lie the eye believes. -->
      <div id="renderBar" class="bar" hidden><div id="renderBarFill"></div></div>
    </div>
  </main>
  <script src="toast.js"></script>
</body>
</html>
