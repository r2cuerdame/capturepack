<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
  />
  <title>CapturePack — Annotate</title>
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <header id="topbar">
    <div id="tools" role="toolbar" aria-label="Annotation tools">
      <button class="tool" data-tool="select" title="Select / move (V)">V</button>
      <button class="tool" data-tool="pin" title="Pin (P)">P</button>
      <button class="tool" data-tool="arrow" title="Arrow (A)">A</button>
      <button class="tool active" data-tool="rect" title="Rectangle (R)">R</button>
      <button class="tool" data-tool="blur" title="Blur (B)">B</button>
      <button class="tool" data-tool="text" title="Text (T)">T</button>
      <button class="tool" id="colorBtn" title="Color (C)"><span id="colorSwatch"></span></button>
    </div>
    <input id="titleInput" type="text" placeholder="Title (optional)" autocomplete="off" spellcheck="false" />
    <input id="noteInput" type="text" placeholder="What is wrong? (optional)" autocomplete="off" spellcheck="false" />
    <span id="replayChip" class="chip">No replay</span>
    <label id="replayToggle" class="chip" hidden>
      <input id="includeReplay" type="checkbox" checked />
      include replay
    </label>
    <span id="keysHint">P pin · A arrow · R rect · B blur · T text · C color · RMB rect · wheel scrub · Ctrl+Z undo · Enter export · Esc cancel</span>
    <button id="exportBtn">Export</button>
  </header>
  <main id="stage">
    <div id="frame">
      <canvas id="snapshot"></canvas>
      <canvas id="overlay" tabindex="-1"></canvas>
      <input id="textEditor" type="text" autocomplete="off" spellcheck="false" hidden />
      <input id="labelEditor" type="text" placeholder="Label" autocomplete="off" spellcheck="false" hidden />
    </div>
    <div id="blurWarning" hidden>
      Blur is not applied to the replay video
      <button id="excludeReplayBtn">exclude replay</button>
    </div>
    <button id="durationChip" title="Edit duration" hidden>1.0s</button>
    <button id="deleteChip" title="Delete (Del)" hidden>×</button>
    <div id="durationEditor" hidden>
      <div id="durationPresets">
        <button type="button" data-ms="500">0.5s</button>
        <button type="button" data-ms="1000">1s</button>
        <button type="button" data-ms="2000">2s</button>
        <button type="button" data-ms="5000">5s</button>
        <button type="button" data-ms="10000">10s</button>
        <button type="button" id="untilEndBtn">Until End</button>
        <button type="button" id="entireCaptureBtn">Entire Capture</button>
      </div>
      <input id="durationInput" type="text" placeholder="custom: 1500ms or 1.5s" autocomplete="off" spellcheck="false" />
    </div>
  </main>
  <footer id="timebar" hidden>
    <button id="playBtn" title="Play / pause" disabled>▶</button>
    <div id="trackArea">
      <div id="lanes" hidden></div>
      <div id="track">
        <div id="trackFill"></div>
        <div id="playhead"></div>
      </div>
    </div>
    <span id="timeLabel">now</span>
    <span id="scrubHint">loading replay…</span>
  </footer>
  <script src="./editor.js"></script>
</body>
</html>
