<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
  />
  <title>CapturePack — Annotate</title>
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <header id="topbar">
    <button id="colorBtn" title="Color (C)"><span id="colorSwatch"></span></button>
    <input id="titleInput" type="text" placeholder="Title (optional)" autocomplete="off" spellcheck="false" />
    <input id="noteInput" type="text" placeholder="What is wrong? (optional)" autocomplete="off" spellcheck="false" />
    <span id="replayChip" class="chip">No replay</span>
    <label id="replayToggle" class="chip" hidden>
      <input id="includeReplay" type="checkbox" checked />
      include replay
    </label>
    <span id="keysHint">L-click select · R-drag box · # number · Blur · Enter save · Esc close</span>
    <button id="exportBtn">Save</button>
  </header>
  <main id="stage">
    <div id="frame">
      <canvas id="snapshot"></canvas>
      <canvas id="overlay" tabindex="-1"></canvas>
      <input id="textEditor" type="text" placeholder="Describe… (Enter)" autocomplete="off" spellcheck="false" hidden />
    </div>
    <!-- Selected-box header: floats above the box in screen space, glued to it
         under zoom/pan. Editor chrome only — never rendered into any output. -->
    <div id="boxHeader" hidden>
      <button id="numberBtn" title="Toggle number">#</button>
      <button id="durationChip" title="Edit duration">1.0s</button>
      <button id="blurBtn" title="Toggle blur">Blur</button>
      <button id="deleteBtn" title="Delete (Del)">×</button>
    </div>
    <div id="durationEditor" hidden>
      <div id="durationPresets">
        <button type="button" data-ms="500">0.5s</button>
        <button type="button" data-ms="1000">1s</button>
        <button type="button" data-ms="2000">2s</button>
        <button type="button" data-ms="5000">5s</button>
        <button type="button" data-ms="10000">10s</button>
        <button type="button" id="untilEndBtn">Until End</button>
        <button type="button" id="entireCaptureBtn">Entire Capture</button>
      </div>
      <input id="durationInput" type="text" placeholder="custom: 1500ms or 1.5s" autocomplete="off" spellcheck="false" />
    </div>
  </main>
  <footer id="timebar" hidden>
    <button id="playBtn" title="Play / pause" disabled>▶</button>
    <div id="trackArea">
      <div id="lanes" hidden></div>
      <div id="track">
        <div id="trackFill"></div>
        <div id="playhead"></div>
      </div>
    </div>
    <span id="timeLabel">now</span>
    <span id="scrubHint">loading replay…</span>
  </footer>
  <script src="./editor.js"></script>
</body>
</html>
