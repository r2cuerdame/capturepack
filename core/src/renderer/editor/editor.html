<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'"
  />
  <title>CapturePack — Annotate</title>
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <header id="topbar">
    <div id="tools" role="toolbar" aria-label="Annotation tools">
      <button class="tool" data-tool="select" title="Select / move (V)">V</button>
      <button class="tool" data-tool="pin" title="Pin (P)">P</button>
      <button class="tool" data-tool="arrow" title="Arrow (A)">A</button>
      <button class="tool active" data-tool="rect" title="Rectangle (R)">R</button>
      <button class="tool" data-tool="blur" title="Blur (B)">B</button>
      <button class="tool" data-tool="text" title="Text (T)">T</button>
      <button class="tool" id="colorBtn" title="Color (C)"><span id="colorSwatch"></span></button>
    </div>
    <input id="titleInput" type="text" placeholder="Title (optional)" autocomplete="off" spellcheck="false" />
    <input id="noteInput" type="text" placeholder="What is wrong? (optional)" autocomplete="off" spellcheck="false" />
    <span id="replayChip" class="chip">No replay</span>
    <label id="replayToggle" class="chip" hidden>
      <input id="includeReplay" type="checkbox" checked />
      include replay
    </label>
    <span id="keysHint">P pin · A arrow · R rect · B blur · T text · C color · Ctrl+Z undo · Enter export · Esc cancel</span>
    <button id="exportBtn">Export</button>
  </header>
  <main id="stage">
    <div id="frame">
      <canvas id="snapshot"></canvas>
      <canvas id="overlay" tabindex="-1"></canvas>
      <input id="textEditor" type="text" autocomplete="off" spellcheck="false" hidden />
    </div>
    <div id="blurWarning" hidden>
      Blur is not applied to the replay video
      <button id="excludeReplayBtn">exclude replay</button>
    </div>
  </main>
  <script src="./editor.js"></script>
</body>
</html>
