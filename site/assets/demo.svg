<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="system-ui, 'Segoe UI', sans-serif">
  <title id="title">CapturePack rewinds to a past frame and selects a real UI control</title>
  <desc id="desc">An animated editor rewinds to a past frame, discovers and selects a Save changes button, shows its captured name, control type and visible state, follows the observed movement of its owner window, and exports structured JSON for AI.</desc>
  <style>
    text { font-family: system-ui, 'Segoe UI', sans-serif }
    .stage { opacity: 0 }
    .eyebrow { fill: #9f8cff; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-anchor: middle }
    .headline { fill: #f5f5f8; font-size: 23px; font-weight: 750; text-anchor: middle }
    .subhead { fill: #aaaaba; font-size: 13px; text-anchor: middle }
    .label { fill: #8f8fa1; font-size: 10px; font-weight: 750; letter-spacing: .1em }
    .value { fill: #f2f2f5; font-size: 13px; font-weight: 650 }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace }

    #caption1 { animation: caption1 12s linear infinite }
    #caption2 { animation: caption2 12s linear infinite }
    #caption3 { animation: caption3 12s linear infinite }
    #caption4 { animation: caption4 12s linear infinite }
    #caption5 { opacity: 1; animation: caption5 12s linear infinite }
    @keyframes caption1 { 0%,1%{opacity:0} 3%,12%{opacity:1} 14%,100%{opacity:0} }
    @keyframes caption2 { 0%,12%{opacity:0} 14%,29%{opacity:1} 31%,100%{opacity:0} }
    @keyframes caption3 { 0%,29%{opacity:0} 31%,49%{opacity:1} 51%,100%{opacity:0} }
    @keyframes caption4 { 0%,49%{opacity:0} 51%,77%{opacity:1} 79%,100%{opacity:0} }
    @keyframes caption5 { 0%,77%{opacity:0} 79%,98%{opacity:1} 100%{opacity:0} }

    #nowChip { animation: nowChip 12s linear infinite }
    #rewindChip { opacity: 0; animation: rewindChip 12s linear infinite }
    #pastChip { opacity: 1; animation: pastChip 12s linear infinite }
    @keyframes nowChip { 0%,2%{opacity:0} 3%,11%{opacity:1} 14%,100%{opacity:0} }
    @keyframes rewindChip { 0%,11%{opacity:0} 14%,28%{opacity:1} 31%,100%{opacity:0} }
    @keyframes pastChip { 0%,28%{opacity:0} 31%,98%{opacity:1} 100%{opacity:0} }

    #playhead {
      transform: translateX(-302px);
      transform-box: view-box;
      transform-origin: 0 0;
      animation: rewindPlayhead 12s cubic-bezier(.45,0,.2,1) infinite;
    }
    @keyframes rewindPlayhead {
      0%,12% { transform: translateX(0) }
      29%,98% { transform: translateX(-302px) }
      100% { transform: translateX(0) }
    }

    #rewindGuide { opacity: .55; animation: rewindGuide 12s linear infinite }
    @keyframes rewindGuide { 0%,11%{opacity:.4} 14%,29%{opacity:1} 32%,100%{opacity:.55} }

    #nowControlState { opacity: 0; animation: nowControlState 12s linear infinite }
    #historicalControl { opacity: 1; animation: historicalControl 12s linear infinite }
    @keyframes nowControlState { 0%,2%{opacity:0} 3%,19%{opacity:1} 29%,100%{opacity:0} }
    @keyframes historicalControl { 0%,19%{opacity:0} 29%,98%{opacity:1} 100%{opacity:0} }

    #cursor {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 0 0;
      animation: cursorMove 12s ease-in-out infinite;
    }
    @keyframes cursorMove {
      0%,29% { opacity:0; transform:translate(620px,205px) }
      32% { opacity:1; transform:translate(620px,205px) }
      41%,48% { opacity:1; transform:translate(518px,346px) }
      51%,100% { opacity:0; transform:translate(518px,346px) }
    }

    #hoverOutline { opacity: 0; animation: hover 12s linear infinite }
    @keyframes hover { 0%,35%{opacity:0} 38%,44%{opacity:1} 47%,100%{opacity:0} }

    #selectedOutline, #objectBadge { opacity: 1; animation: selected 12s linear infinite }
    @keyframes selected { 0%,44%{opacity:0} 47%,98%{opacity:1} 100%{opacity:0} }

    #clickPulse {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: clickPulse 12s ease-out infinite;
    }
    @keyframes clickPulse {
      0%,43%{opacity:0;transform:scale(.4)}
      45%{opacity:.8;transform:scale(.4)}
      50%{opacity:0;transform:scale(1.55)}
      51%,100%{opacity:0;transform:scale(1.55)}
    }

    #movingWindow {
      transform: translate(0,0);
      transform-box: view-box;
      transform-origin: 0 0;
      animation: ownerMove 12s cubic-bezier(.45,0,.2,1) infinite;
    }
    @keyframes ownerMove {
      0%,12% { transform:translate(46px,18px) }
      29%,54% { transform:translate(0,0) }
      72%,100% { transform:translate(46px,18px) }
    }

    #windowGhost, #motionArrow { opacity: 0; animation: motionGuide 12s linear infinite }
    @keyframes motionGuide { 0%,52%{opacity:0} 55%,77%{opacity:1} 80%,100%{opacity:0} }

    #detailsPanel { opacity: 0; animation: details 12s linear infinite }
    #jsonPanel { opacity: 1; animation: json 12s linear infinite }
    @keyframes details { 0%,44%{opacity:0} 47%,77%{opacity:1} 80%,100%{opacity:0} }
    @keyframes json { 0%,78%{opacity:0} 81%,98%{opacity:1} 100%{opacity:0} }

    #trackDot1 { animation: dot1 12s linear infinite }
    #trackDot2 { animation: dot2 12s linear infinite }
    @keyframes dot1 { 0%,55%{opacity:0} 58%,98%{opacity:1} 100%{opacity:0} }
    @keyframes dot2 { 0%,64%{opacity:0} 68%,98%{opacity:1} 100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      #caption1, #caption2, #caption3, #caption4, #nowChip, #rewindChip, #cursor,
      #hoverOutline, #clickPulse, #windowGhost, #motionArrow, #detailsPanel,
      #nowControlState { opacity: 0 }
      #caption5, #pastChip, #historicalControl, #selectedOutline, #objectBadge,
      #jsonPanel, #rewindGuide { opacity: 1 }
      #movingWindow { transform:translate(0,0) }
      #playhead { transform:translateX(-302px) }
    }
  </style>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293250"/>
      <stop offset=".55" stop-color="#1c243c"/>
      <stop offset="1" stop-color="#151a2b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#9d6cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0A84FF" flood-opacity=".75"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#51d6b2"/>
    </marker>
    <marker id="arrowLeft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#a995ff"/>
    </marker>
    <clipPath id="canvasClip"><rect x="46" y="142" width="620" height="288" rx="10"/></clipPath>
  </defs>

  <rect width="960" height="540" fill="url(#page)"/>
  <circle cx="160" cy="80" r="170" fill="#7c5cff" opacity=".06"/>
  <circle cx="830" cy="460" r="210" fill="#36d3b4" opacity=".045"/>

  <g id="caption1" class="stage">
    <text class="eyebrow" x="480" y="25">STEP 1 · BUG NOTICED · NOW</text>
    <text class="headline" x="480" y="51">The button is gone at NOW · 00:12.4</text>
    <text class="subhead" x="480" y="73">Start on the red marker at the right</text>
  </g>
  <g id="caption2" class="stage">
    <text class="eyebrow" x="480" y="25">STEP 2 · REWIND ← 5 SECONDS</text>
    <text class="headline" x="480" y="51">The playhead travels from right to left</text>
    <text class="subhead" x="480" y="73">The earlier UI state comes back</text>
  </g>
  <g id="caption3" class="stage">
    <text class="eyebrow" x="480" y="25">STEP 3 · PAST FRAME · 5s AGO</text>
    <text class="headline" x="480" y="51">“Save changes” existed in this frame</text>
    <text class="subhead" x="480" y="73">Only now does Object Pick select it</text>
  </g>
  <g id="caption4" class="stage">
    <text class="eyebrow" x="480" y="25">STEP 4 · SCRUB FORWARD FROM THE PAST</text>
    <text class="headline" x="480" y="51">The outline follows the observed window translation</text>
    <text class="subhead" x="480" y="73">Past → later; no invented per-control motion</text>
  </g>
  <g id="caption5">
    <text class="eyebrow" x="480" y="25">STEP 5 · HAND OFF THE PAST-FRAME EVIDENCE</text>
    <text class="headline" x="480" y="51">AI receives the object that existed 5 seconds ago</text>
    <text class="subhead" x="480" y="73">Replay + object identity + observed geometry</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="92" width="904" height="424" rx="17" fill="#18181f" stroke="#34343f"/>
    <path d="M28 109a17 17 0 0 1 17-17h870a17 17 0 0 1 17 17v27H28Z" fill="#202028"/>
    <circle cx="51" cy="114" r="5" fill="#ff6159"/>
    <circle cx="69" cy="114" r="5" fill="#ffbd2e"/>
    <circle cx="87" cy="114" r="5" fill="#29c941"/>
    <text x="110" y="119" fill="#ddddE5" font-size="12.5" font-weight="650">CapturePack</text>
    <rect x="805" y="101" width="102" height="26" rx="7" fill="url(#purple)"/>
    <text x="856" y="119" fill="#fff" font-size="11.5" font-weight="750" text-anchor="middle">SAVE PACK</text>

    <g id="nowChip">
      <rect x="663" y="101" width="125" height="26" rx="7" fill="#332226" stroke="#82464b"/>
      <circle cx="679" cy="114" r="4" fill="#ff655d"/>
      <text x="691" y="119" fill="#ffd0ce" font-size="11">BUG · NOW 00:12.4</text>
    </g>
    <g id="rewindChip">
      <rect x="663" y="101" width="125" height="26" rx="7" fill="#2a2340" stroke="#6954bb"/>
      <text x="725.5" y="119" fill="#e3dcff" font-size="11" font-weight="750" text-anchor="middle">◀◀ REWIND 5s</text>
    </g>
    <g id="pastChip">
      <rect x="663" y="101" width="125" height="26" rx="7" fill="#21352f" stroke="#3e836f"/>
      <circle cx="679" cy="114" r="4" fill="#51d6b2"/>
      <text x="691" y="119" fill="#c8f5e8" font-size="11">PAST · 5s AGO</text>
    </g>

    <rect x="46" y="142" width="620" height="288" rx="10" fill="url(#desktop)" stroke="#30394f"/>
    <g clip-path="url(#canvasClip)">
      <circle cx="608" cy="180" r="125" fill="#6475c8" opacity=".12"/>
      <path d="M46 388 220 272l142 78 130-103 174 117v66H46Z" fill="#111727" opacity=".55"/>

      <g id="windowGhost">
        <rect x="82" y="166" width="500" height="212" rx="12" fill="none" stroke="#51d6b2" stroke-width="1.5" stroke-dasharray="6 6" opacity=".7"/>
      </g>

      <g id="movingWindow">
        <rect x="82" y="166" width="500" height="212" rx="12" fill="#f7f7fa" stroke="#d4d4dc"/>
        <path d="M82 178a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v22H82Z" fill="#e9e9ef"/>
        <circle cx="101" cy="183" r="4" fill="#bebeca"/>
        <circle cx="116" cy="183" r="4" fill="#bebeca"/>
        <text x="136" y="188" fill="#5b5b68" font-size="11.5" font-weight="650">Workspace settings</text>

        <rect x="101" y="217" width="118" height="142" rx="8" fill="#eeeeF3"/>
        <rect x="116" y="237" width="73" height="8" rx="4" fill="#b9b9c5"/>
        <rect x="116" y="260" width="88" height="8" rx="4" fill="#d0d0da"/>
        <rect x="116" y="283" width="76" height="8" rx="4" fill="#d0d0da"/>
        <rect x="116" y="306" width="83" height="8" rx="4" fill="#d0d0da"/>

        <text x="241" y="229" fill="#30303a" font-size="13" font-weight="720">Notifications</text>
        <text x="241" y="254" fill="#777783" font-size="10.5">Send a summary after each capture</text>
        <rect x="495" y="237" width="42" height="22" rx="11" fill="#7c5cff"/>
        <circle cx="526" cy="248" r="8" fill="#fff"/>
        <line x1="241" y1="277" x2="544" y2="277" stroke="#dfdfe6"/>
        <text x="241" y="301" fill="#30303a" font-size="12" font-weight="650">Unsaved changes</text>
        <text x="241" y="320" fill="#858590" font-size="10.5">Keep the current preferences?</text>
        <g id="nowControlState">
          <rect x="421" y="326" width="136" height="36" rx="8" fill="#ececf1" stroke="#e26b70" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text x="489" y="341" fill="#a74d52" font-size="9.5" font-weight="800" text-anchor="middle">BUG AT NOW</text>
          <text x="489" y="354" fill="#777783" font-size="9.5" text-anchor="middle">Save button missing</text>
        </g>

        <g id="historicalControl" data-frame="past">
          <rect x="441" y="326" width="116" height="36" rx="8" fill="url(#purple)"/>
          <text x="499" y="349" fill="#fff" font-size="12" font-weight="720" text-anchor="middle">Save changes</text>
          <rect id="hoverOutline" x="437" y="322" width="124" height="44" rx="10" fill="#51d6b2" fill-opacity=".08" stroke="#51d6b2" stroke-width="2.5"/>
          <rect id="selectedOutline" x="437" y="322" width="124" height="44" rx="10" fill="#0A84FF" fill-opacity=".08" stroke="#0A84FF" stroke-width="3" filter="url(#glow)"/>
          <circle id="clickPulse" cx="499" cy="344" r="25" fill="none" stroke="#a995ff" stroke-width="2"/>
          <g id="objectBadge">
            <rect x="426" y="302" width="120" height="19" rx="5" fill="#0A84FF"/>
            <text x="486" y="316" fill="#fff" font-size="9.2" font-weight="800" text-anchor="middle">PAST-FRAME CONTROL</text>
          </g>
        </g>
      </g>

      <g id="motionArrow">
        <path d="M302 390 C318 407 344 410 367 405" fill="none" stroke="#51d6b2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
        <text x="254" y="408" fill="#8be5cc" font-size="10.5" font-weight="700">owner moved</text>
      </g>
    </g>

    <rect x="680" y="142" width="234" height="288" rx="10" fill="#121218" stroke="#34343f"/>
    <rect x="694" y="157" width="206" height="31" rx="7" fill="#202029"/>
    <circle cx="710" cy="172" r="5" fill="#51d6b2"/>
    <text x="723" y="177" fill="#dedee6" font-size="11.5" font-weight="750">OBJECT PICK</text>

    <g id="detailsPanel">
      <text class="label" x="697" y="214">LEVEL</text>
      <text class="value" x="697" y="234">Child control</text>
      <text class="label" x="697" y="263">NAME</text>
      <text class="value" x="697" y="283">Save changes</text>
      <text class="label" x="697" y="312">ROLE / TYPE</text>
      <text class="value" x="697" y="332">Button</text>
      <text class="label" x="697" y="361">CAPTURED STATE</text>
      <text class="value" x="697" y="381">Visible at −12.4s</text>
      <rect x="697" y="397" width="198" height="20" rx="5" fill="#18332e"/>
      <circle cx="709" cy="407" r="3.5" fill="#51d6b2"/>
      <text x="720" y="411" fill="#9be9d4" font-size="10.5">owner track observed</text>
    </g>

    <g id="jsonPanel">
      <text class="label" x="697" y="211">AI-READABLE RESULT</text>
      <rect x="695" y="222" width="204" height="191" rx="7" fill="#0c0c11" stroke="#2e2e39"/>
      <text class="mono" x="707" y="243" fill="#b5a7ff" font-size="10.8">{</text>
      <text class="mono" x="717" y="261" fill="#8f8fa0" font-size="10.8">&quot;target&quot;: {</text>
      <text class="mono" x="727" y="279" fill="#d9d9e1" font-size="10.8">&quot;level&quot;: &quot;control&quot;,</text>
      <text class="mono" x="727" y="297" fill="#d9d9e1" font-size="10.8">&quot;name&quot;: &quot;Save changes&quot;,</text>
      <text class="mono" x="727" y="315" fill="#d9d9e1" font-size="10.8">&quot;control_type&quot;: &quot;Button&quot;</text>
      <text class="mono" x="717" y="333" fill="#8f8fa0" font-size="10.8">},</text>
      <text class="mono" x="717" y="351" fill="#d9d9e1" font-size="10.8">&quot;picked_at_ms&quot;: 17600,</text>
      <text class="mono" x="717" y="369" fill="#d9d9e1" font-size="10.8">&quot;tracking&quot;: { &quot;enabled&quot;: true },</text>
      <text class="mono" x="717" y="387" fill="#d9d9e1" font-size="10.8">&quot;display&quot;: 1</text>
      <text class="mono" x="707" y="405" fill="#b5a7ff" font-size="10.8">}</text>
    </g>

    <rect x="46" y="448" width="868" height="58" rx="9" fill="#111117" stroke="#30303a"/>
    <text x="63" y="466" fill="#777788" font-size="9.5" font-weight="750">REPLAY</text>
    <rect x="112" y="476" width="765" height="8" rx="4" fill="#33333e"/>
    <rect x="112" y="476" width="765" height="8" rx="4" fill="#7c5cff" opacity=".18"/>
    <g id="rewindRail" data-direction="right-to-left">
      <text id="pastMarker" x="554" y="465" fill="#8be5cc" font-size="9.7" font-weight="800" text-anchor="middle">5s AGO · 00:07.4</text>
      <text id="nowMarker" x="856" y="465" fill="#ff918b" font-size="9.7" font-weight="800" text-anchor="middle">NOW · 00:12.4</text>
      <g id="rewindGuide">
        <path id="rewindArrow" d="M 846 480 H 554" fill="none" stroke="#a995ff" stroke-width="3" marker-end="url(#arrowLeft)"/>
        <text id="rewindLabel" x="705" y="501" fill="#b9adff" font-size="9.5" font-weight="800" text-anchor="middle">◀◀ REWIND 5 SECONDS · RIGHT TO LEFT</text>
      </g>
    </g>
    <g id="playhead">
      <line x1="856" y1="469" x2="856" y2="492" stroke="#f3efff" stroke-width="3"/>
      <circle cx="856" cy="480" r="5.5" fill="#f3efff"/>
    </g>
    <circle id="trackDot1" cx="526" cy="480" r="3.5" fill="#51d6b2"/>
    <circle id="trackDot2" cx="572" cy="480" r="3.5" fill="#51d6b2"/>
    <text x="112" y="501" fill="#6f6f7f" font-size="9.5">BUFFER START · −30s</text>
  </g>

  <g id="cursor">
    <path d="M0 0V21l5.4-4.6 4.2 9.1 4-1.9-4.2-8.8h7.3Z" fill="#f8f8fb" stroke="#14141a" stroke-width="1.5"/>
  </g>
</svg>
