<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .cap { font-size: 22px; font-weight: 650; fill: #ececf1; text-anchor: middle; }
    .dim { fill: #9a9aa6; }
    g[id^="s"] { opacity: 0; }
    /* 8s loop: six quick steps */
    #s1 { animation: st1 8s linear infinite; }
    #s2 { animation: st2 8s linear infinite; }
    #s3 { animation: st3 8s linear infinite; }
    #s4 { animation: st4 8s linear infinite; }
    #s5 { animation: st5 8s linear infinite; }
    #s6 { animation: st6 8s linear infinite; }
    @keyframes st1 { 0%,1% {opacity:0} 3%,13% {opacity:1} 15%,100% {opacity:0} }
    @keyframes st2 { 0%,15% {opacity:0} 17%,28% {opacity:1} 30%,100% {opacity:0} }
    @keyframes st3 { 0%,30% {opacity:0} 32%,45% {opacity:1} 47%,100% {opacity:0} }
    @keyframes st4 { 0%,47% {opacity:0} 49%,63% {opacity:1} 65%,100% {opacity:0} }
    @keyframes st5 { 0%,65% {opacity:0} 67%,83% {opacity:1} 85%,100% {opacity:0} }
    @keyframes st6 { 0%,85% {opacity:0} 87%,98% {opacity:1} 100% {opacity:0} }

    /* frozen frame + timeline appear from step 2 on */
    #frozen { opacity: 0; animation: frz 8s linear infinite; }
    @keyframes frz { 0%,15% {opacity:0} 17%,98% {opacity:1} 100% {opacity:0} }

    /* playhead scrubs into the past during step 3 */
    #playhead { animation: ph 8s linear infinite; }
    @keyframes ph { 0%,31% { transform: translateX(0) } 45%,100% { transform: translateX(-190px) } }

    /* cursor: appears for the drag, travels corner to corner, moves to the note, fades */
    #cursor { opacity: 0; animation: cur 8s linear infinite; }
    @keyframes cur {
      0%,47%  { opacity: 0; transform: translate(586px, 276px) }
      49%     { opacity: 1; transform: translate(586px, 276px) }
      62%     { opacity: 1; transform: translate(734px, 336px) }
      66%     { opacity: 1; transform: translate(560px, 372px) }
      82%     { opacity: 1; transform: translate(560px, 372px) }
      85%,100%{ opacity: 0; transform: translate(560px, 372px) }
    }

    /* selection rect grows with the drag */
    #objrect { opacity: 0; transform-box: fill-box; transform-origin: top left; animation: obj 8s linear infinite; }
    @keyframes obj {
      0%,48%  { opacity: 0; transform: scale(0.06) }
      50%     { opacity: 1; transform: scale(0.06) }
      62%     { opacity: 1; transform: scale(1) }
      98%     { opacity: 1; transform: scale(1) }
      100%    { opacity: 0; transform: scale(1) }
    }

    /* annotation note box appears, then the text types itself */
    #note { opacity: 0; animation: nt 8s linear infinite; }
    @keyframes nt { 0%,65% {opacity:0} 67%,98% {opacity:1} 100% {opacity:0} }
    #typecover { animation: tc 8s linear infinite; }
    @keyframes tc { 0%,68% { transform: translateX(0) } 82%,100% { transform: translateX(242px) } }
    #caret { animation: ca 8s linear infinite; }
    @keyframes ca {
      0%,67% { opacity: 0 }
      68%,81% { opacity: 1 }
      83%,100% { opacity: 0 }
    }
  </style>

  <!-- backdrop -->
  <rect width="960" height="540" fill="#0e0e12"/>

  <!-- caption line -->
  <g>
    <g id="s1"><text class="cap" x="480" y="52">Press  Ctrl + Alt + C</text></g>
    <g id="s2"><text class="cap" x="480" y="52">The last 30 seconds freeze</text></g>
    <g id="s3"><text class="cap" x="480" y="52">Mouse wheel moves through time</text></g>
    <g id="s4"><text class="cap" x="480" y="52">Drag to select the object</text></g>
    <g id="s5"><text class="cap" x="480" y="52">Write the annotation</text></g>
    <g id="s6"><text class="cap" x="480" y="52">issue.capturepack exported ✓</text></g>
  </g>

  <!-- mock screen -->
  <g>
    <rect x="140" y="86" width="680" height="360" rx="14" fill="#1a1a22" stroke="#26262e"/>
    <!-- app window -->
    <rect x="190" y="120" width="580" height="290" rx="10" fill="#202029" stroke="#2e2e38"/>
    <rect x="190" y="120" width="580" height="34" rx="10" fill="#262630"/>
    <circle cx="212" cy="137" r="5" fill="#3a3a46"/>
    <circle cx="230" cy="137" r="5" fill="#3a3a46"/>
    <!-- layout: sidebar + content -->
    <rect x="208" y="170" width="130" height="220" rx="8" fill="#262631"/>
    <rect x="356" y="170" width="300" height="140" rx="8" fill="#262631"/>
    <!-- the "bug": button overflowing its container -->
    <rect x="596" y="286" width="128" height="40" rx="8" fill="#7c5cff"/>
    <text x="660" y="311" font-size="16" fill="#ffffff" text-anchor="middle">Submit</text>
  </g>

  <!-- frozen frame indicator + timeline -->
  <g id="frozen">
    <rect x="140" y="86" width="680" height="360" rx="14" fill="none" stroke="#7c5cff" stroke-width="2.5"/>
    <rect x="190" y="466" width="580" height="6" rx="3" fill="#26262e"/>
    <g id="playhead" transform="translate(0,0)">
      <rect x="742" y="458" width="4" height="22" rx="2" fill="#7c5cff"/>
    </g>
    <text x="190" y="500" font-size="14" class="dim">-30s</text>
    <text x="770" y="500" font-size="14" class="dim" text-anchor="end">now</text>
  </g>

  <!-- drag-selection rectangle -->
  <g id="objrect">
    <rect x="588" y="278" width="144" height="56" rx="6" fill="rgba(255,59,48,0.10)" stroke="#ff3b30" stroke-width="2.5"/>
  </g>

  <!-- annotation note with typing text -->
  <g id="note">
    <rect x="374" y="336" width="270" height="38" rx="8" fill="#14141a" stroke="#3a3a46"/>
    <text x="388" y="361" font-size="16" fill="#ececf1">Submit overflows container</text>
    <!-- cover slides right, revealing the text as if typed -->
    <g id="typecover">
      <rect x="386" y="342" width="242" height="26" fill="#14141a"/>
      <rect id="caret" x="386" y="344" width="2" height="22" fill="#ececf1"/>
    </g>
    <!-- keep the cover from spilling outside the note box -->
    <rect x="628" y="340" width="120" height="30" fill="#0e0e12" opacity="0"/>
  </g>

  <!-- mouse cursor -->
  <g id="cursor">
    <path d="M0,0 L0,16 L4.5,12.5 L7.5,19 L10,17.8 L7,11.5 L12.5,11.5 Z"
          fill="#ffffff" stroke="#111116" stroke-width="1"/>
  </g>
</svg>
