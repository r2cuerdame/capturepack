<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .cap    { font-size: 26px; font-weight: 700; fill: #17171c; text-anchor: middle; }
    .capsub { font-size: 15px; fill: #6b6b78; text-anchor: middle; }
    .step   { font-size: 13px; font-weight: 700; fill: #7c5cff; text-anchor: middle; letter-spacing: .12em; }
    g[id^="s"] { opacity: 0 }
    #s1 { animation: st1 9s linear infinite } #s2 { animation: st2 9s linear infinite }
    #s3 { animation: st3 9s linear infinite } #s4 { animation: st4 9s linear infinite }
    #s5 { animation: st5 9s linear infinite }
    @keyframes st1 { 0%,1%{opacity:0} 3%,16%{opacity:1} 18%,100%{opacity:0} }
    @keyframes st2 { 0%,18%{opacity:0} 20%,36%{opacity:1} 38%,100%{opacity:0} }
    @keyframes st3 { 0%,38%{opacity:0} 40%,57%{opacity:1} 59%,100%{opacity:0} }
    @keyframes st4 { 0%,59%{opacity:0} 61%,78%{opacity:1} 80%,100%{opacity:0} }
    @keyframes st5 { 0%,80%{opacity:0} 82%,97%{opacity:1} 99%,100%{opacity:0} }

    #frozen { opacity: 0; animation: frz 9s linear infinite }
    @keyframes frz { 0%,18%{opacity:0} 20%,97%{opacity:1} 99%,100%{opacity:0} }
    #playhead { animation: ph 9s linear infinite }
    @keyframes ph { 0%,40%{transform:translateX(0)} 55%,100%{transform:translateX(-214px)} }

    #cursor { opacity: 0; animation: cur 9s linear infinite }
    /* THE CURSOR DRAGS THE BOX THAT APPEARS. Its tip is the path's origin, so
       these translates ARE the rectangle's corners: #objrect is (598,314) to
       (746,372) and scales from its top-left over the same 62%-74% window. They
       were 78px apart before, which read as the cursor drawing one rectangle
       while a different one showed up. */
    @keyframes cur {
      0%,58%   { opacity:0; transform: translate(598px,314px) }
      61%      { opacity:1; transform: translate(598px,314px) }
      74%      { opacity:1; transform: translate(746px,372px) }
      78%      { opacity:1; transform: translate(470px,392px) }
      96%      { opacity:1; transform: translate(470px,392px) }
      98%,100% { opacity:0; transform: translate(470px,392px) }
    }
    #objrect { opacity:0; transform-box: fill-box; transform-origin: top left; animation: obj 9s linear infinite }
    @keyframes obj {
      0%,60%{opacity:0; transform:scale(.05)} 62%{opacity:1; transform:scale(.05)}
      74%{opacity:1; transform:scale(1)} 97%{opacity:1; transform:scale(1)} 99%,100%{opacity:0; transform:scale(1)}
    }
    #note { opacity:0; animation: nt 9s linear infinite }
    @keyframes nt { 0%,78%{opacity:0} 80%,97%{opacity:1} 99%,100%{opacity:0} }
    #typecover { animation: tc 9s linear infinite }
    @keyframes tc { 0%,81%{transform:translateX(0)} 93%,100%{transform:translateX(228px)} }
    #saved { opacity:0; animation: sv 9s linear infinite }
    @keyframes sv { 0%,94%{opacity:0} 96%,99%{opacity:1} 100%{opacity:0} }
  </style>

  <defs>
    <clipPath id="noteClip"><rect x="330" y="392" width="252" height="30" rx="6"/></clipPath>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#9d5cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17171c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f6f6f9"/>

  <!-- caption -->
  <g>
    <g id="s1"><text class="step" x="480" y="40">STEP 1</text><text class="cap" x="480" y="70">Press Ctrl + Alt + C</text><text class="capsub" x="480" y="94">after the bug already happened</text></g>
    <g id="s2"><text class="step" x="480" y="40">STEP 2</text><text class="cap" x="480" y="70">The last 30 seconds freeze</text><text class="capsub" x="480" y="94">CapturePack was already recording</text></g>
    <g id="s3"><text class="step" x="480" y="40">STEP 3</text><text class="cap" x="480" y="70">Scroll back through time</text><text class="capsub" x="480" y="94">the wheel moves 100 ms per notch</text></g>
    <g id="s4"><text class="step" x="480" y="40">STEP 4</text><text class="cap" x="480" y="70">Drag a box on the problem</text><text class="capsub" x="480" y="94">right-drag — no tool to pick first</text></g>
    <g id="s5"><text class="step" x="480" y="40">STEP 5</text><text class="cap" x="480" y="70">Type it. Done.</text><text class="capsub" x="480" y="94">a CapturePack folder lands on your desktop</text></g>
  </g>

  <!-- app mockup: LIGHT ui -->
  <g filter="url(#soft)">
    <rect x="150" y="120" width="660" height="330" rx="14" fill="#ffffff" stroke="#e2e2ea"/>
    <rect x="150" y="120" width="660" height="40" rx="14" fill="#f1f1f6"/>
    <rect x="150" y="146" width="660" height="14" fill="#f1f1f6"/>
    <circle cx="174" cy="140" r="5" fill="#ff5f57"/><circle cx="192" cy="140" r="5" fill="#febc2e"/><circle cx="210" cy="140" r="5" fill="#28c840"/>
    <rect x="240" y="131" width="300" height="18" rx="9" fill="#e6e6ee"/>

    <!-- sidebar -->
    <rect x="170" y="180" width="130" height="250" rx="10" fill="#f5f5f9"/>
    <rect x="186" y="200" width="74" height="9" rx="4.5" fill="#c9c9d6"/>
    <rect x="186" y="222" width="98" height="9" rx="4.5" fill="#dcdce6"/>
    <rect x="186" y="244" width="86" height="9" rx="4.5" fill="#dcdce6"/>
    <rect x="186" y="266" width="94" height="9" rx="4.5" fill="#dcdce6"/>

    <!-- form -->
    <rect x="322" y="186" width="60" height="9" rx="4.5" fill="#b6b6c6"/>
    <rect x="322" y="204" width="330" height="30" rx="8" fill="#f5f5f9" stroke="#e6e6ee"/>
    <rect x="322" y="254" width="80" height="9" rx="4.5" fill="#b6b6c6"/>
    <rect x="322" y="272" width="330" height="30" rx="8" fill="#f5f5f9" stroke="#e6e6ee"/>

    <!-- the bug: submit button overflowing the card -->
    <rect x="606" y="322" width="132" height="42" rx="9" fill="url(#btn)"/>
    <text x="672" y="349" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Submit</text>
  </g>

  <!-- frozen frame + timeline -->
  <g id="frozen">
    <rect x="146" y="116" width="668" height="338" rx="16" fill="none" stroke="#7c5cff" stroke-width="3"/>
    <rect x="196" y="474" width="568" height="8" rx="4" fill="#e0e0ea"/>
    <g id="playhead"><rect x="752" y="464" width="5" height="28" rx="2.5" fill="#7c5cff"/></g>
    <text x="196" y="506" font-size="13" fill="#8a8a99">−30s</text>
    <text x="764" y="506" font-size="13" fill="#8a8a99" text-anchor="end">now</text>
  </g>

  <!-- annotation -->
  <g id="objrect"><rect x="598" y="314" width="148" height="58" rx="8" fill="rgba(255,59,48,.10)" stroke="#ff3b30" stroke-width="3"/></g>

  <g id="note">
    <rect x="326" y="388" width="260" height="38" rx="8" fill="#17171c"/>
    <text x="340" y="413" font-size="15" fill="#ffffff">Submit overflows the card</text>
    <g clip-path="url(#noteClip)"><g id="typecover">
      <rect x="338" y="392" width="228" height="30" fill="#17171c"/>
      <rect x="338" y="396" width="2" height="22" fill="#ffffff"/>
    </g></g>
  </g>

  <g id="saved">
    <rect x="330" y="452" width="300" height="34" rx="8" fill="#e9fbef" stroke="#7fd79b"/>
    <text x="348" y="474" font-size="14" fill="#177a3c">✓ CapturePack_2026-07-27_143052 saved</text>
  </g>

  <g id="cursor">
    <path d="M0,0 L0,17 L4.8,13.2 L8,20 L10.8,18.7 L7.6,12.1 L13.4,12.1 Z" fill="#17171c" stroke="#ffffff" stroke-width="1.4"/>
  </g>
</svg>
