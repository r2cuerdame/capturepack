name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      # One runner owns the release-candidate floor. It discovers every
      # package.json check:* script, then typechecks and builds sequentially,
      # while preserving a complete failure/duration summary for diagnosis.
      - name: Release-candidate QA gate
        working-directory: core
        run: npm run qa:rc -- --artifacts "${{ runner.temp }}\capturepack-qa"

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturepack-qa-${{ github.run_id }}
          path: ${{ runner.temp }}\capturepack-qa
          if-no-files-found: error
          retention-days: 14

  spec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate example pack against spec
        run: |
          if [ ! -f tools/validate-capturepack.mjs ]; then
            echo "Skipping spec validation: tools/validate-capturepack.mjs does not exist yet."
          elif [ ! -d examples/minimal ]; then
            echo "Skipping spec validation: examples/minimal does not exist yet."
          else
            node tools/validate-capturepack.mjs examples/minimal
          fi
