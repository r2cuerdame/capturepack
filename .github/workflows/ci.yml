name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        timeout-minutes: 10
        run: npm ci

      # One runner owns the release-candidate floor. It discovers every
      # package.json check:* script, then typechecks and builds sequentially,
      # while preserving a complete failure/duration summary for diagnosis.
      - name: Release-candidate QA gate
        working-directory: core
        timeout-minutes: 15
        run: npm run qa:rc -- --artifacts "${{ runner.temp }}\capturepack-qa"

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturepack-qa-${{ github.run_id }}
          path: ${{ runner.temp }}\capturepack-qa
          if-no-files-found: error
          retention-days: 14

  # CI MAKES A PACK AND ASSERTS ON IT (#63).
  #
  # Until this job existed, CI proved that the app boots. Every question about a
  # capture — is the replay real, does the snapshot match the display, do the
  # declared displays agree with the screens — could only be answered by asking
  # a human to record one and send it over, which is how every investigation
  # this cycle ended. `--capture-now` had existed for months and nothing ran it,
  # because a capture opens the editor and then waits for a person; `--save-now`
  # is the person.
  #
  # BLOCKING SINCE 0.4.3. It was non-blocking on purpose while it was the first
  # headed Electron capture anyone had run on a hosted runner, and the condition
  # for promoting it was stated at the time: green for a run of merges. It has
  # been — twelve consecutive CI runs from 2026-08-02 to 2026-08-09, every one
  # of them green on this job.
  #
  # The cost of waiting longer was measured rather than argued. On the 0.4.1
  # candidate this job went RED inside a run that reported success, and the
  # release could have shipped with nobody having looked at it. A job whose
  # failures are invisible is not evidence, whatever it asserts.
  capture-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Build
        run: npm run build

      # A capture, unattended, through the very entry point the global hotkey
      # uses. `--capture-now=6` is not padding: the replay buffer and the surface
      # ring have to be FULL of something before there is anything to record,
      # and capturing the instant the app starts would assert on a fraction of a
      # second. The exit code is the verdict — 0 saved, 20 the flow saved
      # nothing, 21 it never finished (see src/main/saveNow.ts).
      - name: Capture a pack, with nobody at the machine
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e"
          New-Item -ItemType Directory -Force "$work\userdata" | Out-Null
          New-Item -ItemType Directory -Force "$work\packs" | Out-Null
          & .\node_modules\.bin\electron.cmd . `
            --user-data-dir="$work\userdata" `
            --output-dir="$work\packs" `
            --no-global-shortcut `
            --capture-now=6 `
            --save-now=180
          Write-Host "capture exited $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Assert on the pack
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e"
          $pack = (Get-ChildItem -Directory "$work\packs" | Select-Object -First 1).FullName
          if ($null -eq $pack) { throw "no pack was written to $work\packs" }
          Write-Host "asserting on $pack"
          node scripts/assert-capturepack.mjs $pack --expect-replay --log "$work\userdata\logs\main.log"
          exit $LASTEXITCODE

      # The other ending, and the one that has to stay honest: a recorder that
      # is given nothing. The pack must SAY the replay is unavailable rather
      # than shipping an empty container, and the outage must be announced at
      # most once — never once per retry cycle. Which of the two endings this
      # produces depends on whether the windows-gdi-bitblt fallback rescues the
      # recorder in time, so the assertion holds for both (see
      # scripts/assert-capturepack.mjs).
      - name: Capture again with the recorder starved (--simulate-no-frames)
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e-no-frames"
          New-Item -ItemType Directory -Force "$work\userdata" | Out-Null
          New-Item -ItemType Directory -Force "$work\packs" | Out-Null
          & .\node_modules\.bin\electron.cmd . `
            --user-data-dir="$work\userdata" `
            --output-dir="$work\packs" `
            --no-global-shortcut `
            --simulate-no-frames `
            --capture-now=6 `
            --save-now=180
          Write-Host "capture exited $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Assert the failure is honest
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e-no-frames"
          $pack = (Get-ChildItem -Directory "$work\packs" | Select-Object -First 1).FullName
          if ($null -eq $pack) { throw "no pack was written to $work\packs" }
          Write-Host "asserting on $pack"
          node scripts/assert-capturepack.mjs $pack --expect-no-replay --log "$work\userdata\logs\main.log"
          exit $LASTEXITCODE

      # AND A PACK THAT WAITED FOR ITS DERIVED MEDIA (#135).
      #
      # The two captures above exit at the SOURCE boundary, which is the honest
      # boundary and the one they are right to assert on: the pack is complete
      # and valid the moment the source is written, and the annotated replay and
      # keyframe stills are a later refinement that the exit abandons. The cost
      # only became visible once the job first went green — every pack CI had
      # ever seen carried no `media.keyframes`, so the contract added in #133 (a
      # keyframe declares its own width/height, and the file agrees) had no
      # end-to-end coverage at all. It was checked against a fixture and against
      # nothing this app had actually rendered.
      #
      # `--await-render` buys the other half without moving the boundary: the
      # save deadline still bounds the capture, and a SECOND budget — spent on a
      # hidden window re-encoding a replay, so its length is a property of the
      # runner's CPU — starts only once the source is already durable. The two
      # stay distinguishable in the exit code: 0 saved and rendered, 22 the pack
      # is saved and the render ran long, 23 the render failed (src/main/saveNow.ts).
      - name: Capture a third pack and wait for the derived render
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e-rendered"
          New-Item -ItemType Directory -Force "$work\userdata" | Out-Null
          New-Item -ItemType Directory -Force "$work\packs" | Out-Null
          & .\node_modules\.bin\electron.cmd . `
            --user-data-dir="$work\userdata" `
            --output-dir="$work\packs" `
            --no-global-shortcut `
            --capture-now=6 `
            --save-now=180 `
            --await-render=240
          Write-Host "capture exited $LASTEXITCODE"
          exit $LASTEXITCODE

      # --expect-keyframes: the run WAITED, so an absent media.keyframes is now a
      # failure rather than a pack that was simply asserted early. Every declared
      # still is opened and held to the size it declares — never to the
      # snapshot's, because a still is legitimately taller (SPEC §5.7).
      - name: Assert the rendered pack carries its stills
        run: |
          $work = "${{ runner.temp }}\capturepack-e2e-rendered"
          $pack = (Get-ChildItem -Directory "$work\packs" | Select-Object -First 1).FullName
          if ($null -eq $pack) { throw "no pack was written to $work\packs" }
          Write-Host "asserting on $pack"
          node scripts/assert-capturepack.mjs $pack --expect-replay --expect-keyframes --log "$work\userdata\logs\main.log"
          exit $LASTEXITCODE

      # The pack and the log, whatever happened. A failing assertion that cannot
      # be looked at afterwards is the situation this whole job exists to end.
      - name: Upload the packs and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturepack-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\capturepack-e2e
            ${{ runner.temp }}\capturepack-e2e-no-frames
            ${{ runner.temp }}\capturepack-e2e-rendered
          if-no-files-found: warn
          retention-days: 14

  spec-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate example pack against spec
        run: |
          if [ ! -f tools/validate-capturepack.mjs ]; then
            echo "Skipping spec validation: tools/validate-capturepack.mjs does not exist yet."
          elif [ ! -d examples/minimal ]; then
            echo "Skipping spec validation: examples/minimal does not exist yet."
          else
            node tools/validate-capturepack.mjs examples/minimal
          fi
