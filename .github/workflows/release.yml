name: Release

# TRIGGERED BY HAND, NEVER BY A PUSH.
#
# This used to run on `push: tags: ["v*"]`, which made pushing a tag the same
# act as publishing a release — and since a release is a decision and a push is
# not, the safe move was to push NOTHING. That is exactly what happened:
# 140-odd commits and a v0.2.0 tag sat unpushed while the public repository
# stayed at v0.1.7, because there was no way to update the source without
# shipping an installer at the same time.
#
# Separating them costs one button. `workflow_dispatch` takes the tag to build,
# creates it from the chosen ref when it does not exist yet, and still refuses
# to run unless it matches core/package.json — the check that keeps
# electron-updater from being handed a version installed apps will never see.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. vX.Y.Z (created from the selected ref if it does not exist)'
        required: true
        type: string

permissions:
  contents: write

# Public releases are serialized. Two different version jobs finishing out of
# order could otherwise make an older build the repository's "latest" release.
concurrency:
  group: capturepack-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # electron-builder derives the version (artifact names, latest.yml) from
      # core/package.json; a mismatched tag would publish an update installed
      # apps never see, or collide with a previous release's assets. The check
      # is unchanged by the move to a manual trigger — it just reads the input
      # rather than the ref that triggered the run.
      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content core/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match core/package.json version $version"
          }

      # A failed retry may legitimately find a draft, but an already-public
      # release is immutable input here. Never let automation replace public
      # binaries for an existing tag.
      - name: Guard existing release state
        shell: pwsh
        timeout-minutes: 2
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = gh release view "$env:RELEASE_TAG" --json isDraft,tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            $release = $output | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already public; refusing to replace its assets."
            }
            Write-Host "A draft exists for $env:RELEASE_TAG; this run will verify and resume it."
          } elseif ("$output" -match "HTTP 404|release not found|not found") {
            Write-Host "No existing release for $env:RELEASE_TAG."
          } else {
            throw "Could not verify release state: $output"
          }
          # PowerShell preserves the expected failed `gh release view` native
          # exit code even after the branch handles it. Reset it explicitly or
          # the otherwise-successful step still exits 1 on a brand-new tag.
          $global:LASTEXITCODE = 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        timeout-minutes: 10
        run: npm ci

      # The public artifact must pass the same gate as the candidate the user
      # confirmed locally: all deterministic regressions, site/spec validation,
      # a fresh build, and an isolated Electron smoke test.
      - name: Full RC QA gate
        working-directory: core
        timeout-minutes: 10
        run: npm run qa:rc -- --fail-fast

      # Package locally first. Publishing directly from electron-builder used
      # to make the release visible before latest.yml and SHA256SUMS were
      # checked; a malformed or partial updater release could therefore escape.
      - name: Package release artifacts
        working-directory: core
        timeout-minutes: 15
        run: npm run dist

      # Verifies the exact installer name/version, rejects stale installers in
      # the output directory, and checks latest.yml's size + both sha512 fields
      # against the actual bytes before writing the one-line SHA256SUMS file.
      - name: Verify local release contract
        working-directory: core
        timeout-minutes: 5
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-contract-check.mjs --tag "$env:RELEASE_TAG" --release-dir release --package package.json

      # Create the tag only AFTER QA, packaging, and the local hash contract
      # pass. A failed candidate must not leave a public-looking tag behind, and
      # a retry must never publish one commit under a tag pointing elsewhere.
      - name: Create or verify the release tag
        shell: pwsh
        timeout-minutes: 3
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          if (git rev-parse -q --verify "$tagRef^{commit}") {
            $tagCommit = (git rev-list -n 1 $tagRef).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG points at $tagCommit, not checked-out commit $env:GITHUB_SHA"
            }
            Write-Host "$env:RELEASE_TAG already points at the checked-out commit"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$env:RELEASE_TAG" $env:GITHUB_SHA
            git push origin "$env:RELEASE_TAG"
          }

      # Releases are UNSIGNED — accepted V1 limitation (GOAL.md: signing "when
      # possible"; no certificate is available yet). Update integrity relies on
      # electron-updater's sha512 check via latest.yml plus SHA256SUMS.txt.
      # All four files remain in a draft until the byte-for-byte remote check.
      - name: Upload verified assets to draft
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content core/package.json -Raw | ConvertFrom-Json).version
          $existing = gh release view "$env:RELEASE_TAG" --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG became public before verification."
            }
            # A timed-out prior attempt can leave a partial or obsolete draft.
            # Clear only this verified draft's assets so every retry starts
            # from the same exact four-file contract.
            foreach ($asset in @($release.assets)) {
              gh release delete-asset "$env:RELEASE_TAG" $asset.name --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove stale draft asset $($asset.name)."
              }
            }
          } else {
            gh release create "$env:RELEASE_TAG" --draft --verify-tag --title "$version"
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release." }
          }

          $installer = "CapturePack-Setup-$version.exe"
          $assets = @(
            "core/release/$installer",
            "core/release/$installer.blockmap",
            "core/release/latest.yml",
            "core/release/SHA256SUMS.txt"
          )
          gh release upload "$env:RELEASE_TAG" $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the complete draft asset set." }

      - name: Verify draft assets byte-for-byte
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content core/package.json -Raw | ConvertFrom-Json).version
          $installer = "CapturePack-Setup-$version.exe"
          $names = @($installer, "$installer.blockmap", "latest.yml", "SHA256SUMS.txt")
          $release = gh release view "$env:RELEASE_TAG" --json isDraft,tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read the draft release." }
          if (-not $release.isDraft) { throw "Release became public before remote verification." }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Remote release tag mismatch." }

          $actualNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expectedNames = @($names | Sort-Object)
          if (Compare-Object $expectedNames $actualNames) {
            throw "Remote draft assets differ from the exact expected set: $actualNames"
          }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP "capturepack-release-verify"
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          foreach ($name in $names) {
            gh release download "$env:RELEASE_TAG" --dir $downloadDirectory --pattern $name --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not download remote asset $name." }
            $local = Join-Path "core/release" $name
            $remote = Join-Path $downloadDirectory $name
            $localHash = (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $remote -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) {
              throw "Remote asset bytes do not match local verification: $name"
            }
          }

      # This is the only step that makes the update visible to users.
      - name: Publish verified draft
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified draft." }
